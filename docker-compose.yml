version: '3.8'

services:
  mlflow:
    build: .
    container_name: energy_forecaster_mlflow
    command: mlflow server --backend-store-uri sqlite:///mlruns.db --default-artifact-root /app/mlruns --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
      - ./mlruns.db:/app/mlruns.db

  api:
    build: .
    container_name: energy_forecaster_api
    command: uvicorn src.serving.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./configs:/app/configs
    depends_on:
      - mlflow

  dashboard:
    build: .
    container_name: energy_forecaster_dashboard
    command: streamlit run src/serving/app_streamlit.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data/processed:/app/data/processed
      - ./reports:/app/reports
    depends_on:
      - api
